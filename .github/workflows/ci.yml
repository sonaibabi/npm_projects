name: CI on pull request
on:
  push:
  pull_request:
    types: [ opened ]
jobs:
    Build_Job:
        runs-on: ubuntu-latest
        strategy:
          matrix:
            node-version: ['18.x', '20.x']
        steps:
        - uses: actions/checkout@v5
          name: Checkout GitHUb Repository

        - name: Set up nodeJS
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.node-version }}